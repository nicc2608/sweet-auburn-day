<!-- Sweet Auburn Day popup. Paste into an Elementor HTML widget inside the popup. Desktop: 600 x 800. Phones: its own stacked layout, full width of the popup. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Everything is scoped to #sad-popup and sized in --u (1/600 of the popup width), so the layout scales as one piece.
   The width comes from the screen, not the popup container: 600px, or the screen width minus 32px on phones.
   (No container queries: inside a popup sized to its content they collapse to zero width on some phones.) */
#sad-popup { --w: min(600px, calc(100vw - 32px)); width: var(--w); max-width: 100%; margin: 0 auto; }
#sad-popup * { box-sizing: border-box; margin: 0; padding: 0; }
#sad-popup .sap { --u: calc(var(--w) / 600); --ink: #020202; --brown: #7c4816; --gold: #f5d155; --white: #ffffff;
  position: relative; overflow: hidden; aspect-ratio: 600 / 800; background: var(--white); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; text-align: left; }
#sad-popup .sap-photo { position: absolute; top: calc(-100 * var(--u)); right: calc(-120 * var(--u)); width: calc(500 * var(--u)); aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
#sad-popup .sap-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%; border: 0; max-width: none; }
/* The lower part of the photo fades into the white so the date can sit over its edge. */
#sad-popup .sap-photo { -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 92%); mask-image: linear-gradient(to bottom, #000 62%, transparent 92%); }
#sad-popup .sap-logo { position: absolute; top: calc(32 * var(--u)); left: calc(40 * var(--u)); width: calc(124 * var(--u)); height: auto; display: block; }
#sad-popup .sap-body { position: absolute; left: calc(40 * var(--u)); right: calc(40 * var(--u)); bottom: calc(40 * var(--u)); display: grid; gap: calc(12 * var(--u)); }
#sad-popup .sap-presents { font: 400 calc(14 * var(--u))/1.2 "DM Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); }
#sad-popup .sap-date { font: 400 calc(30 * var(--u))/1.05 "BBH Hegarty", "Arial Black", sans-serif; text-transform: uppercase; color: var(--brown); }
#sad-popup .sap-date span { display: block; }
#sad-popup .sap-head { font: 400 calc(80 * var(--u))/.9 "BBH Hegarty", "Arial Black", sans-serif; text-transform: uppercase; color: var(--ink); letter-spacing: 0; }
#sad-popup .sap-head > span { display: block; }
#sad-popup .sap-head > span:first-child { position: relative; width: fit-content; }
#sad-popup .sap-badge { position: absolute; top: 50%; left: calc(100% + 14 * var(--u)); width: calc(104 * var(--u)); transform: translateY(-50%); }
#sad-popup .sap-badge svg { display: block; width: 100%; height: auto; overflow: visible; }
#sad-popup .sap-disc { fill: var(--gold); }
#sad-popup .sap-badge text { font-family: "BBH Hegarty", "Arial Black", sans-serif; fill: var(--ink); }
#sad-popup .sap-ring { transform-origin: 100px 100px; animation: sap-spin 26s linear infinite; }
#sad-popup .sap-ring text { font-size: 16px; }
#sad-popup .sap-num { font-size: 66px; }
#sad-popup .sap-intro { max-width: calc(380 * var(--u)); font-size: calc(17 * var(--u)); line-height: 1.4; }
#sad-popup .sap-actions { display: flex; gap: calc(12 * var(--u)); padding-top: calc(6 * var(--u)); }
#sad-popup .sap-btn { display: inline-flex; align-items: center; justify-content: center; padding: calc(18 * var(--u)) calc(40 * var(--u)); border: 1.5px solid var(--ink); font: 400 calc(16 * var(--u))/1.2 "BBH Hegarty", "Arial Black", sans-serif; text-transform: uppercase; text-decoration: none; white-space: nowrap; transition: background-color .2s, color .2s, transform .2s; box-shadow: none; }
#sad-popup .sap-btn:hover { transform: translateY(-2px); }
#sad-popup .sap-btn-gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
#sad-popup .sap-btn-gold:hover { background: var(--ink); border-color: var(--ink); color: var(--white); }
#sad-popup .sap-btn-line { background: none; color: var(--ink); }
#sad-popup .sap-btn-line:hover { background: var(--ink); color: var(--white); }
/* Entrance: the photo opens and the text rises, like the landing's hero. */
#sad-popup .sap-photo { animation: sap-open 1.2s cubic-bezier(.2,.7,.2,1) both; }
#sad-popup .sap-in { animation: sap-rise .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.2s + var(--i, 0) * .08s); }
@keyframes sap-open { from { clip-path: circle(0 at 50% 55%); } to { clip-path: circle(75% at 50% 55%); } }
@keyframes sap-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes sap-spin { to { transform: rotate(360deg); } }
/* Phones: a different layout, like the landing's mobile hero. The photo runs edge to edge across the top
   and fades into the white, the negative logo sits on the photo, and the text stacks below at phone sizes. */
@media (max-width: 600px) {
  #sad-popup .sap { aspect-ratio: auto; display: flex; flex-direction: column; padding: 0 20px 24px; }
  #sad-popup .sap-photo { position: relative; top: auto; right: auto; width: auto; height: 250px; aspect-ratio: auto; margin: 0 -20px; border-radius: 0; flex-shrink: 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent 96%); mask-image: linear-gradient(to bottom, #000 50%, transparent 96%); }
  #sad-popup .sap-photo img { object-position: 50% 45%; }
  @keyframes sap-open-m { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
  #sad-popup .sap-photo { animation-name: sap-open-m; }
  #sad-popup .sap-logo { top: 16px; left: 20px; width: 96px; filter: drop-shadow(0 1px 6px rgb(2 2 2 / .35)); }
  #sad-popup .sap-logo path[fill="#020202"] { fill: #ffffff; }
  #sad-popup .sap-logo path[fill="#854302"] { fill: #f5d155; }
  #sad-popup .sap-body { position: relative; left: auto; right: auto; bottom: auto; margin-top: -44px; gap: 10px; }
  #sad-popup .sap-presents { font-size: 12px; }
  #sad-popup .sap-date { font-size: clamp(20px, 6.6vw, 26px); }
  #sad-popup .sap-head { font-size: calc((min(600px, 100vw - 32px) - 40px) * .175); }
  #sad-popup .sap-badge { width: clamp(64px, 20vw, 84px); left: calc(100% + 10px); }
  #sad-popup .sap-intro { max-width: none; font-size: 15px; }
  #sad-popup .sap-actions { padding-top: 6px; }
  #sad-popup .sap-btn { width: 100%; padding: 16px 20px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { #sad-popup * { animation: none !important; transition: none !important; } }
</style>
